name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  # never cancel runs on main, they might be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HMC_SPECIFICS_API_REPO: hmc-specifics/hmc-specifics-api/build/maven
    steps:
      # the submodule is only checked out if hmc-specifics-api is not cached
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Get hmc-specifics commit
        id: hmc-specifics
        run: echo "sha=$(git rev-parse HEAD:hmc-specifics)" >> "$GITHUB_OUTPUT"

      - name: Cache hmc-specifics-api
        id: hmc-specifics-api-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: hmc-specifics-api-${{ steps.hmc-specifics.outputs.sha }}
          path: ${{ env.HMC_SPECIFICS_API_REPO }}

      - name: Build hmc-specifics-api
        if: steps.hmc-specifics-api-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 hmc-specifics
          ./gradlew -p hmc-specifics/hmc-specifics-api publishAllPublicationsToBuildDirMavenRepository --stacktrace

      - name: Build
        run: ./gradlew build "-PhmcSpecificsApiRepo=$HMC_SPECIFICS_API_REPO" --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hmc-prometheus
          # the shadow jar is the runnable mod, the -dev jar does not contain Prometheus
          path: |
            build/libs/hmc-prometheus-*.jar
            !build/libs/hmc-prometheus-*-dev.jar
          if-no-files-found: error

  mc-runtime-test:
    name: Test ${{ matrix.mc }} ${{ matrix.type }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forge before 1.13, HMC-Specifics is loaded as a tweaker
          - mc: 1.12.2
            type: lexforge
            modloader: forge
            java: 8
          - mc: 26.3
            type: lexforge
            modloader: forge
            java: 25
          - mc: 26.3
            type: neoforge
            modloader: neoforge
            java: 25
          - mc: 26.3
            type: fabric
            modloader: fabric
            java: 25
    steps:
      - name: Checkout # for hmc-prometheus-test.json and the versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get versions
        id: versions
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          echo "hmc-specifics=$(version hmc-specifics)" >> "$GITHUB_OUTPUT"
          echo "headlessmc=$(version headlessmc)" >> "$GITHUB_OUTPUT"

      - name: Download mod jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hmc-prometheus
          path: run/mods

      - name: Download HMC-Specifics
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.hmc-specifics }}
        run: |
          gh release download "$VERSION" --repo headlesshq/hmc-specifics --dir run/mods \
            --pattern "hmc-specifics-${{ matrix.mc }}-$VERSION-${{ matrix.type }}-release.jar"
          ls run/mods

      - name: Setup Java temurin-${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # mc-runtime-test appends its own configuration to this file
      - name: Configure HeadlessMC test
        run: |
          mkdir -p HeadlessMC
          cat <<EOF >> HeadlessMC/config.properties
          hmc.test.file=$PWD/hmc-prometheus-test.json
          hmc.log.console-level=INFO
          EOF

      - name: Run game
        uses: headlesshq/mc-runtime-test@dfc8a2a0145f723b01abda5e1cf59eaba516d128 # 5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.modloader }}
          java: ${{ matrix.java }}
          mc-runtime-test: none
          xvfb: false
          hmc-version: ${{ steps.versions.outputs.headlessmc }}
          headlessmc-command: --retries 3 --jvm "-Djava.awt.headless=true -Dhmc.jline.enabled=false"

  release:
    runs-on: ubuntu-latest
    needs: [release-please, build, mc-runtime-test]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Download mod jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hmc-prometheus
      - name: Upload release assets
        # the release itself (tag and notes) has been created by release-please
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber hmc-prometheus-*.jar
